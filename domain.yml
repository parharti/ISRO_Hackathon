version: "3.1"

intents:
  - perform_web_automation
  - greet
   - iam_bot

responses:
  utter_greet:
    - text: "Hello! How can I help you today?"

  utter_goodbye:
      - text: "Goodbye! Have a great day."

  utter_iam_bot:
    - text: "yes,i am a bot"


actions:
